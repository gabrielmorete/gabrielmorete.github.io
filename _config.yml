title: Gabriel M. de Azevedo
first_name: Gabriel
middle_name:
last_name: Morete de Azevedo
description: Academic website of Gabriel Morete de Azevedo, who publishes as Gabriel de Azevedo. PhD student at Cornell ORIE working on social choice, sortition, and combinatorial optimization.
keywords: social choice, sortition, combinatorial optimization
lang: en

seo:
  title: Gabriel Morete de Azevedo | Gabriel de Azevedo
  name: Gabriel Morete de Azevedo
  alternate_names:
    - Gabriel de Azevedo
    - Gabriel M. de Azevedo
  image: /assets/img/me.jpg
  job_title: PhD student
  affiliation:
    name: Cornell University
    url: https://www.cornell.edu/
  same_as:
    - https://github.com/gabrielmorete

url: https://gabrielmazevedo.com
baseurl:

navbar_fixed: true
back_to_top: true
enable_darkmode: true
enable_progressbar: true
max_width: 1200px

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-cache-bust
  - jekyll-imagemagick
  - jekyll-minifier
  - jekyll-sitemap
  - jekyll-terser

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  exclude:
    - robots.txt

terser:
  compress:
    drop_console: true

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

third_party_libraries:
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js"
    version: "3.6.0"
  mdb:
    integrity:
      css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
      js: "sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA="
    url:
      css: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css"
      js: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/js/mdb.min.js"
    version: "4.20.0"
