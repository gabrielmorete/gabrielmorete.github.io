items:
  - text: >-
      **May 26:** I will present my work on Maximally Random Sortition at INFORMS 2026, in the session *Frontiers in Operations: Algorithms, AI, and Their Societal Impact*.
  - text: >-
      **Jan 26:** I am organizing [NYC Ops Day 2026](https://sites.google.com/stern.nyu.edu/nyc-ops-day-2026/home){:target="_blank" rel="external nofollow noopener"}. You should come!
  - text: >-
      **Oct 25:** I will give a talk at [DR&D](https://www.drd2025.org/){:target="_blank" rel="external nofollow noopener"} about my new sortition algorithm and the updated version of the Panelot platform that I have been building together with [Carmel Baharav](https://www.carmelbaharav.com/){:target="_blank" rel="external nofollow noopener"}, [Bailey Flanigan](https://sites.google.com/mit.edu/bailey-flanigan/home){:target="_blank" rel="external nofollow noopener"}, and [Paul Gölz](https://paulgoelz.de/){:target="_blank" rel="external nofollow noopener"}.
  - text: >-
      **Aug 25:** I will present a poster on my work on sortition at [YinzOR](https://yinzor.cmuinforms.org/){:target="_blank" rel="external nofollow noopener"}.
  - text: >-
      **Mar 25:** I will present a poster on my work on approximation algorithms for the 2-edge-connected spanning subgraph problem at [NYC Ops Day 2025](https://sites.google.com/stern.nyu.edu/nyc-ops-day-2025/home){:target="_blank" rel="external nofollow noopener"}.
