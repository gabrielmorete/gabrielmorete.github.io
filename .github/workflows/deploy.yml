name: Deploy site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Build
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          build_log="$(mktemp)"
          if ! bundle exec jekyll build --trace 2>&1 | tee "$build_log"; then
            build_error="$(tail -n 30 "$build_log" | tr '\n' ' ' | sed 's/%/%25/g')"
            printf '::error title=Jekyll build failed::%s\n' "$build_error"
            exit 1
          fi
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
